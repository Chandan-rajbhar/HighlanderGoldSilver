<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/brand/highlander_crest_favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Highlander Gold & Silver — Admin Console</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-warm-body text-slate-800 antialiased font-sans min-h-screen">
    <div id="root">
      <div style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #ffffff; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; z-index: 9999;">
        <div style="position: relative; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
          <div style="position: absolute; inset: 0; border: 2.5px solid #F1F5F9; border-top-color: #C9A23A; border-right-color: rgba(201, 162, 58, 0.4); border-radius: 50%; animation: hgsSpin 1s linear infinite;"></div>
          <img src="/assets/brand/highlander_crest_favicon.png" alt="Highlander" style="width: 28px; height: 28px; object-fit: contain;" />
        </div>
        <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.25em; color: #071A35; margin-bottom: 4px;">
          Highlander Gold &amp; Silver
        </div>
        <div style="font-size: 11px; color: #94A3B8; margin-bottom: 16px;">
          Authenticating Secure Depository Console...
        </div>
        <div style="width: 144px; height: 3px; background-color: #F1F5F9; border-radius: 999px; overflow: hidden; position: relative;">
          <div style="position: absolute; inset: 0; width: 50%; background: linear-gradient(90deg, transparent, #C9A23A, transparent); border-radius: 999px; animation: hgsProgress 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;"></div>
        </div>
      </div>
      <style>
        @keyframes hgsSpin { to { transform: rotate(360deg); } }
        @keyframes hgsProgress { 0% { transform: translateX(-100%); } 50% { transform: translateX(50%); } 100% { transform: translateX(200%); } }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
